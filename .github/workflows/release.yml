# PyInstaller cannot cross-compile: a Windows .exe must be built ON Windows,
# a macOS .app ON macOS. You only need to push a tag; GitHub does the rest.
#
# Release ritual (same tag also triggers publish.yml -> PyPI):
#   1. bump version in pyproject.toml + installer.iss, commit
#   2. git tag v3.4.1
#   3. git push && git push --tags
#   4. wait ~10 min -> Releases page has DSM_Optimizer_Windows.zip + _macOS.zip
#
# Linux desktop builds are intentionally omitted: pywebview needs GTK/WebKit
# system packages that make CI bundles fragile. Linux users get the identical
# app via `pip install dsm-optimizer`.
name: Build desktop -

on:
  push:
    tags: ["v*"]

permissions:
  contents: write          # needed to create the Release and upload assets

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: DSM_Optimizer_Windows
          - os: macos-latest
            artifact: DSM_Optimizer_macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install dependencies
        run: pip install numpy scikit-learn openpyxl flask matplotlib waitress pywebview pyinstaller

      - name: Run tests first
        run: |
          pip install pytest
          pytest tests/ -v

      - name: Build with PyInstaller
        run: pyinstaller DSM_Optimizer.spec --noconfirm

      - name: Zip the build
        shell: python
        run: |
          import shutil
          shutil.make_archive("${{ matrix.artifact }}", "zip", "dist", "DSM_Optimizer")

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
